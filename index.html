<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BatyaGPT - 3.5 (ALPHA)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #050505; 
            color: #d4d4d8;
        }

        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .glass {
            background: rgba(20, 20, 25, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        #main-ui, #welcome-screen {
            position: relative;
            z-index: 10;
        }

        .chat-container::-webkit-scrollbar {
            width: 4px;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 10px;
        }

        .typing-cursor::after {
            content: '▋';
            margin-left: 2px;
            color: #60a5fa;
            animation: blink 1s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .btn-batya {
            transition: all 0.3s ease;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #94a3b8;
        }
        .btn-batya:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: #60a5fa;
            color: #e2e8f0;
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(96, 165, 250, 0.2);
        }

        .input-glow:focus {
            box-shadow: 0 0 20px rgba(96, 165, 250, 0.15);
            border-color: rgba(96, 165, 250, 0.4);
        }

        #game-canvas {
            background: #0a0a0a;
            border: 1px solid #27272a;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            width: 100%;
            max-width: 400px;
            height: auto;
            aspect-ratio: 1/1;
        }

        .level-bar-fill {
            transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(90deg, #3b82f6, #6366f1);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
        }

        .msg-batya {
            border-left: 2px solid #60a5fa;
            color: #bfdbfe;
        }
        .msg-user {
            background: linear-gradient(135deg, #27272a 0%, #18181b 100%);
            border: 1px solid rgba(255,255,255,0.05);
            color: #e4e4e7;
        }

        .nick-line {
            opacity: 0; 
            transform: translateX(-10px);
        }

        /* Mobile Controls */
        .game-btn {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .game-btn:active {
            transform: scale(0.95);
            background: rgba(59, 130, 246, 0.4);
        }

        /* UPDATED: New Welcome Screen Styles */
        .welcome-card {
            background: rgba(10, 10, 12, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        
        .welcome-btn-glow {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 100%);
            color: #0f172a;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .welcome-btn-glow:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
        }
        .welcome-btn-glow::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(255,255,255,0.2), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .welcome-btn-glow:hover::after {
            opacity: 1;
        }

        /* UPDATED: Restart Button Style */
        .restart-btn-final {
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #94a3b8;
            transition: all 0.3s ease;
        }
        .restart-btn-final:hover {
            border-color: #60a5fa;
            color: #fff;
            background: rgba(96, 165, 250, 0.1);
            box-shadow: 0 0 20px rgba(96, 165, 250, 0.2);
        }
    </style>
</head>
<body>

<canvas id="starfield"></canvas>

<!-- Level Up Overlay -->
<div id="level-up-overlay" class="fixed inset-0 z-[80] hidden flex flex-col items-center justify-center pointer-events-none">
    <div class="relative text-center">
        <h2 class="text-6xl md:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-br from-blue-400 to-purple-600 drop-shadow-[0_0_20px_rgba(59,130,246,0.5)] transform scale-0" id="levelup-title">LEVEL UP</h2>
        <p class="text-4xl md:text-6xl font-mono text-white mt-4 font-bold transform scale-0" id="levelup-num">10</p>
    </div>
</div>

<!-- Nickname Modal -->
<div id="nick-modal" class="fixed inset-0 z-[70] hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass p-8 rounded-2xl w-full max-w-md transform scale-90 opacity-0 transition-all duration-300">
        <h3 class="text-2xl font-bold text-blue-400 mb-2">Введи свой ник</h3>
        <p class="text-gray-400 text-sm mb-6">Только латинские буквы (A-Z)</p>
        <input type="text" id="nick-input-modal" class="w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 mb-4 font-mono text-center text-xl uppercase" placeholder="NICKNAME" maxlength="15">
        <div class="flex gap-3">
            <button id="cancel-nick-btn" class="flex-1 py-3 rounded-xl border border-white/10 text-gray-400 hover:bg-white/5">Отмена</button>
            <button id="submit-nick-btn" class="flex-1 py-3 rounded-xl bg-blue-600 text-white font-bold hover:bg-blue-500 shadow-lg shadow-blue-900/20">Отправить</button>
        </div>
    </div>
</div>

<!-- Welcome Screen (UPDATED DESIGN) -->
<div id="welcome-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black/95 backdrop-blur-sm">
    <div class="welcome-card relative z-10 text-center px-8 py-12 md:px-12 md:py-16 rounded-3xl max-w-xl w-full mx-4 border border-white/5 shadow-2xl">
        <!-- Decoration lines -->
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-blue-500/50 to-transparent opacity-50"></div>
        <div class="absolute bottom-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-blue-500/50 to-transparent opacity-50"></div>

        <h1 id="welcome-text" class="text-4xl md:text-5xl font-black mb-8 leading-tight text-transparent bg-clip-text bg-gradient-to-b from-gray-100 via-gray-300 to-gray-500 tracking-tight opacity-0 transform translate-y-10">
            Тот самый...<br>
            <span class="text-2xl md:text-3xl font-bold text-gray-500 block my-2">Легендарный...</span>
            <span class="text-5xl md:text-7xl block my-4 text-blue-400 drop-shadow-[0_0_25px_rgba(96,165,250,0.4)] filter brightness-110">Batya</span>
            <span class="text-xl text-gray-400 font-normal">Вернулся вновь...</span>
        </h1>
        
        <div class="h-px w-24 bg-gradient-to-r from-transparent via-gray-700 to-transparent mx-auto mb-10"></div>

        <button id="start-chat-btn" class="welcome-btn-glow px-10 py-4 text-sm md:text-base font-bold tracking-widest rounded-xl shadow-lg opacity-0 transform scale-90 uppercase">
            НАЧАТЬ ЧАТ
        </button>
        
        <p class="mt-6 text-[10px] text-gray-600 font-mono tracking-widest uppercase opacity-60">Version 3.5 Alpha</p>
    </div>
</div>

<!-- Main UI -->
<div id="main-ui" class="hidden h-screen flex opacity-0">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-72 glass border-r border-white/5 p-6 flex flex-col hidden md:flex z-20">
        <div class="flex items-center gap-3 mb-10">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-slate-700 to-slate-800 border border-white/10 flex items-center justify-center text-blue-300 font-bold text-xl shadow-lg">B</div>
            <div>
                <h2 class="text-xl font-bold text-gray-300 leading-none">BatyaGPT</h2>
                <span class="text-[10px] text-gray-500 font-mono tracking-widest">VER 3.5 ALPHA</span>
            </div>
        </div>
        
        <div class="mb-auto p-4 rounded-xl bg-black/20 border border-white/5 relative overflow-hidden" id="sidebar-level-box">
            <div class="flex justify-between items-end mb-2">
                <p class="text-xs text-gray-500 uppercase tracking-wider font-bold">Уровень Бати</p>
                <p id="level-text" class="text-right text-lg font-black text-blue-400 font-mono">Lvl 1</p>
            </div>
            <div class="w-full h-2 bg-gray-900 rounded-full overflow-hidden border border-white/5 relative">
                <div id="level-fill" class="level-bar-fill h-full relative" style="width: 1%">
                    <div class="absolute right-0 top-0 bottom-0 w-[2px] bg-white/30"></div>
                </div>
            </div>
        </div>

        <div class="text-[10px] text-gray-600 mt-4 text-center font-mono">
            BatyaGPT created by VortexFlare
        </div>
    </aside>

    <!-- Chat Area -->
    <main class="flex-1 flex flex-col relative overflow-hidden">
        <!-- Chat Header for Mobile -->
        <div class="md:hidden glass p-4 border-b border-white/5 flex justify-between items-center z-20">
             <h2 class="text-lg font-bold text-gray-300">BatyaGPT 3.5</h2>
             <span id="mobile-level" class="text-xs font-mono text-blue-400">Lvl 1</span>
        </div>

        <div id="chat-box" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 chat-container z-10 relative">
            <!-- Messages go here -->
        </div>

        <!-- Quick Actions & Input Area -->
        <div class="z-20 flex flex-col items-center w-full">
            <div class="w-full h-16 bg-gradient-to-t from-[#050505] to-transparent pointer-events-none"></div>
            
            <div class="w-full bg-[#050505]/90 backdrop-blur-md border-t border-white/5 pb-6 pt-2">
                <div id="quick-actions" class="px-4 pb-4 flex flex-wrap gap-3 justify-center max-w-4xl mx-auto min-h-[40px]">
                    <!-- Dynamic buttons appear here -->
                </div>

                <div class="max-w-4xl mx-auto px-4 flex gap-3 pb-safe">
                    <input id="user-input" type="text" placeholder="Напиши что-нибудь бате..." 
                           class="input-glow flex-1 bg-[#121215] border border-white/10 text-gray-300 rounded-xl px-5 py-4 focus:outline-none transition-all placeholder-gray-600 font-medium text-base">
                    <button id="send-btn" class="px-6 py-4 bg-slate-800 text-blue-300 border border-white/5 font-bold rounded-xl hover:bg-slate-700 hover:text-white transition-all shadow-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Game Overlay -->
<div id="game-overlay" class="fixed inset-0 z-[60] hidden bg-black/95 backdrop-blur-md flex-col items-center justify-center p-4 overflow-y-auto">
    <div class="glass p-6 md:p-8 rounded-3xl max-w-lg w-full text-center border border-white/5 shadow-2xl transform scale-95 opacity-0 game-modal-anim relative">
        <h2 class="text-3xl font-black mb-2 text-gray-200 tracking-tight" id="game-title">СПАСАЙ БАТЮ</h2>
        <div class="h-1 w-20 bg-blue-500/50 mx-auto mb-4 rounded-full"></div>
        <p class="mb-4 text-gray-500 text-sm hidden md:block" id="game-desc">A - Влево, D - Вправо</p>
        
        <div class="relative inline-block w-full max-w-[400px] rounded-xl overflow-hidden shadow-2xl border border-white/10">
            <canvas id="game-canvas" width="400" height="400"></canvas>
            <div class="absolute top-4 right-4 bg-black/60 backdrop-blur px-3 py-1 rounded-lg border border-red-500/20 pointer-events-none">
                <span id="game-timer" class="text-2xl font-black text-red-400 font-mono">60</span>
            </div>
            
            <div id="game-over-screen" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center hidden z-20">
                <h3 class="text-2xl font-bold text-red-500 mb-4">БАТЮ ЗАШИБЛО!</h3>
                <button onclick="startMiniGame()" class="px-6 py-2 bg-blue-900/50 hover:bg-blue-800 text-blue-200 border border-blue-500/30 rounded-lg transition-colors">
                    Попробовать снова
                </button>
            </div>
        </div>

        <!-- Mobile Controls -->
        <div class="flex md:hidden gap-4 mt-6 w-full justify-center">
            <button id="btn-left" class="game-btn flex-1 h-16 bg-white/10 rounded-2xl border border-white/10 text-3xl flex items-center justify-center text-white">
                ←
            </button>
            <button id="btn-right" class="game-btn flex-1 h-16 bg-white/10 rounded-2xl border border-white/10 text-3xl flex items-center justify-center text-white">
                →
            </button>
        </div>
    </div>
</div>

<!-- Fullscreen Alerts (Cinematic) -->
<div id="full-alert" class="fixed inset-0 z-[100] hidden bg-black flex flex-col items-center justify-center text-center p-10">
    <div class="relative z-10 flex flex-col items-center">
        <h2 id="full-alert-text" class="text-4xl md:text-7xl font-black mb-6 text-gray-200 tracking-tighter opacity-0 translate-y-10"></h2>
        <p id="full-alert-sub" class="text-gray-600 font-mono tracking-widest text-sm uppercase opacity-0"></p>
        <!-- UPDATED: Added Restart Button -->
        <button id="restart-global-btn" class="restart-btn-final mt-12 px-8 py-3 rounded-full text-sm font-bold tracking-widest uppercase">
            НАЧАТЬ ЧАТ ЗАНОВО
        </button>
    </div>
    <!-- Bg grain -->
    <div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noise%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noise)%22 opacity=%221%22/%3E%3C/svg%3E');"></div>
</div>

<script>
    // --- CONFIG & CONSTANTS ---
    const NICK_SCHEMA_FIRST = {
        'A': 'Абсурдный', 'B': 'Беспонтовый', 'C': 'Стремный', 'D': 'Долбанутый', 'E': 'Ебанутый',
        'F': 'Фейковый', 'G': 'Глючный', 'H': 'Хреновый', 'I': 'Идиотский', 'J': 'Жопорукий',
        'K': 'Кринжовый', 'L': 'Лютый', 'M': 'Мразотный', 'N': 'Невменяемый', 'O': 'Отбитый',
        'P': 'Полоумный', 'Q': 'Куцый', 'R': 'Рофляный', 'S': 'Ссыкливый', 'T': 'Тупорылый',
        'U': 'Упоротый', 'V': 'Вонючий', 'W': 'Weird’овый', 'X': 'Хренопоймикакой', 'Y': 'Йобнутый', 'Z': 'Зашкварный'
    };
    const NICK_SCHEMA_LAST = {
        'A': 'Арбузатор', 'B': 'Бутерброд', 'C': 'Самовар', 'D': 'Дирижабль', 'E': 'Емкость',
        'F': 'Фонарик', 'G': 'Горшок', 'H': 'Химик', 'I': 'Индюк', 'J': 'Жмых',
        'K': 'Кактус', 'L': 'Лифт', 'M': 'Миксер', 'N': 'Носорог', 'O': 'Огнетушитель',
        'P': 'Пылесос', 'Q': 'Квант', 'R': 'Ракета', 'S': 'Скафандр', 'T': 'Тапок',
        'U': 'Унитаз', 'V': 'Вентилятор', 'W': 'Вафлятор', 'X': 'Холодильник', 'Y': 'Йогурт', 'Z': 'Завод'
    };

    let currentLevel = 1;

    // --- STARFIELD ---
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function initStars() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        stars = [];
        for (let i = 0; i < 300; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speedX: (Math.random() - 0.5) * 0.1, 
                speedY: (Math.random() - 0.5) * 0.1,
                opacity: Math.random() * 0.5 + 0.1,
                pulseSpeed: Math.random() * 0.01 + 0.005,
                pulseDir: 1
            });
        }
    }

    function animateStars() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        stars.forEach(star => {
            star.x += star.speedX;
            star.y += star.speedY;
            
            if (star.x < 0) star.x = canvas.width;
            if (star.x > canvas.width) star.x = 0;
            if (star.y < 0) star.y = canvas.height;
            if (star.y > canvas.height) star.y = 0;
            
            star.opacity += star.pulseSpeed * star.pulseDir;
            if (star.opacity > 0.8 || star.opacity < 0.1) star.pulseDir *= -1;

            ctx.globalAlpha = star.opacity;
            ctx.fillStyle = '#a1a1aa';
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
        });
        requestAnimationFrame(animateStars);
    }

    window.addEventListener('resize', initStars);
    initStars();
    animateStars();

    // --- UI LOGIC ---
    const welcomeScreen = document.getElementById('welcome-screen');
    const mainUi = document.getElementById('main-ui');
    const welcomeText = document.getElementById('welcome-text');
    const startBtn = document.getElementById('start-chat-btn');
    const restartGlobalBtn = document.getElementById('restart-global-btn'); // New Restart Button

    window.onload = () => {
        const tl = gsap.timeline();
        tl.to(welcomeText, { opacity: 1, y: 0, duration: 2, ease: "power4.out" })
          .to(startBtn, { opacity: 1, scale: 1, duration: 1, ease: "power2.out" }, "-=0.5");
    };

    startBtn.onclick = () => {
        gsap.to(welcomeScreen, { opacity: 0, duration: 0.8, ease: "power2.inOut", onComplete: () => {
            welcomeScreen.style.display = 'none';
            mainUi.classList.remove('hidden');
            
            gsap.to(mainUi, { opacity: 1, duration: 0.5 });
            gsap.from("aside", { x: -30, opacity: 0, duration: 0.8, delay: 0.2, ease: "power3.out" });
            gsap.from("#chat-box", { y: 20, opacity: 0, duration: 0.8, delay: 0.4, ease: "power3.out" });
            gsap.from(".input-glow", { y: 20, opacity: 0, duration: 0.8, delay: 0.6, ease: "power3.out" });

            addBatyaMessage("Здарова, ёпта. Чё пришёл? Выбирай чё надо или пиши сам.");
            showQuickActions(['дать расшифровать свой ник бате', 'дай мудрый совет от бати', 'Ку']);
        }});
    };
    
    // Restart functionality
    restartGlobalBtn.onclick = () => {
        location.reload();
    };

    // --- CHAT SYSTEM ---
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const quickActions = document.getElementById('quick-actions');

    function addMessage(text, isUser = false) {
        const msg = document.createElement('div');
        msg.className = `flex ${isUser ? 'justify-end' : 'justify-start'} items-end gap-3 mb-6 opacity-0`;
        
        const avatar = !isUser ? 
            `<div class="w-8 h-8 rounded-full bg-gradient-to-br from-slate-700 to-slate-800 border border-white/10 flex-shrink-0 flex items-center justify-center text-xs font-bold text-blue-300 shadow-md">B</div>` : 
            '';

        const bubbleClass = isUser ? 
            'msg-user rounded-2xl rounded-tr-sm px-5 py-3 shadow-lg max-w-[85%]' : 
            'glass msg-batya rounded-2xl rounded-tl-sm px-5 py-3 shadow-lg max-w-[85%]';

        msg.innerHTML = `
            ${!isUser ? avatar : ''}
            <div class="${bubbleClass}">
                <div class="leading-relaxed ${!isUser ? 'typing-cursor' : ''}">${text}</div>
            </div>
        `;
        
        chatBox.appendChild(msg);
        
        setTimeout(() => {
            chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
        }, 50);

        gsap.to(msg, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" });

        if (!isUser) {
            const contentDiv = msg.querySelector('.leading-relaxed');
            // Check if content is HTML (specifically for nickname decryption)
            if (text.includes('nick-line')) {
                 contentDiv.classList.remove('typing-cursor');
                 contentDiv.innerHTML = text; 
                 // Stagger animation for nickname lines
                 gsap.to(contentDiv.querySelectorAll('.nick-line'), {
                     opacity: 1, x: 0, duration: 0.5, stagger: 0.15, ease: "back.out(1.2)"
                 });
            } else if (text.includes('<')) {
                // Other HTML content
                 contentDiv.classList.remove('typing-cursor');
                 contentDiv.innerHTML = text; 
            } else {
                // Plain text typing effect
                const originalText = text;
                contentDiv.innerText = "";
                let i = 0;
                const interval = setInterval(() => {
                    contentDiv.innerText += originalText[i];
                    i++;
                    chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
                    if (i >= originalText.length) {
                        clearInterval(interval);
                        contentDiv.classList.remove('typing-cursor');
                    }
                }, 20);
            }
        }
    }

    function addBatyaMessage(text) {
        addMessage(text, false);
    }

    function setLevel(lvl) {
        if (currentLevel === lvl) return;
        currentLevel = lvl;
        
        // 1. Fullscreen Animation
        const overlay = document.getElementById('level-up-overlay');
        const title = document.getElementById('levelup-title');
        const num = document.getElementById('levelup-num');
        const sideBarBox = document.getElementById('sidebar-level-box');
        
        overlay.classList.remove('hidden');
        num.innerText = lvl;

        // Reset positions
        gsap.set([title, num], { scale: 0, opacity: 0 });

        const tl = gsap.timeline();

        // Explosion in center
        tl.to([title, num], { scale: 1.2, opacity: 1, duration: 0.5, ease: "elastic.out(1, 0.5)", stagger: 0.1 })
          .to([title, num], { scale: 1, duration: 0.2 })
          // Pause to admire
          .to({}, { duration: 0.8 }) 
          // Move towards sidebar (top left approximation for desktop)
          .to([title, num], { 
              x: -window.innerWidth/3, 
              y: -window.innerHeight/3, 
              scale: 0.1, 
              opacity: 0, 
              duration: 0.6, 
              ease: "power3.in" 
          })
          .call(() => {
              overlay.classList.add('hidden');
              // Update actual sidebar UI
              document.getElementById('level-fill').style.width = lvl + '%';
              document.getElementById('level-text').innerText = `Lvl ${lvl}`;
              document.getElementById('mobile-level').innerText = `Lvl ${lvl}`;
              
              // Flash sidebar
              gsap.fromTo(sideBarBox, { borderColor: "#60a5fa", boxShadow: "0 0 20px rgba(96,165,250,0.5)" }, { borderColor: "rgba(255,255,255,0.05)", boxShadow: "none", duration: 1 });
          });
    }

    function showQuickActions(actions) {
        quickActions.innerHTML = '';
        actions.forEach((act, index) => {
            const btn = document.createElement('button');
            btn.className = 'btn-batya px-5 py-2 rounded-full text-sm font-bold tracking-wide opacity-0 transform translate-y-4';
            btn.innerText = act;
            btn.onclick = () => handleAction(act);
            quickActions.appendChild(btn);
            
            gsap.to(btn, { opacity: 1, y: 0, duration: 0.4, delay: index * 0.1, ease: "back.out(1.7)" });
        });
    }

    // --- NICKNAME MODAL LOGIC ---
    const nickModal = document.getElementById('nick-modal');
    const nickInputModal = document.getElementById('nick-input-modal');
    const cancelNickBtn = document.getElementById('cancel-nick-btn');
    const submitNickBtn = document.getElementById('submit-nick-btn');
    const nickModalContent = nickModal.querySelector('.glass');

    function openNickModal() {
        nickModal.classList.remove('hidden');
        gsap.to(nickModalContent, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out" });
        nickInputModal.value = '';
        nickInputModal.focus();
    }

    function closeNickModal() {
        gsap.to(nickModalContent, { scale: 0.9, opacity: 0, duration: 0.2, onComplete: () => {
            nickModal.classList.add('hidden');
        }});
    }

    cancelNickBtn.onclick = closeNickModal;
    
    submitNickBtn.onclick = () => {
        const val = nickInputModal.value.trim();
        if (!val) return;
        
        // Validate Latin only
        if (!/^[a-zA-Z]+$/.test(val)) {
            // Shake animation
            gsap.to(nickModalContent, { x: 10, duration: 0.05, yoyo: true, repeat: 5 });
            nickInputModal.style.borderColor = "red";
            return;
        }
        
        nickInputModal.style.borderColor = "rgba(255,255,255,0.1)";
        closeNickModal();
        addMessage(val, true); // Show user message
        setTimeout(() => processNick(val), 500); // Process
    };

    function handleAction(action) {
        if (action === 'Ку') {
            addMessage("Ку", true);
            handleGreeting();
            return;
        }

        if (action === 'дать расшифровать свой ник бате') {
            addMessage(action, true);
            addBatyaMessage("Отлично ёпта, пиши свой ник сюда, латинскими буквами, скажу истину твоего ника... ");
            // Open modal after short delay
            setTimeout(openNickModal, 1500);
            return;
        }

        addMessage(action, true);
        
        if (action === 'дай мудрый совет от бати') {
            const tips = [
                "Запомни раз и на всегда, ёпта: Не уступай место бабкам в автобусе, потому что бабки в жизни не главное.",
                "Отличник никогда не пойдет на бокс, потому что там он может получить двоечку.",
                "Упал - Вставай , Вставал - Упай, Упай - Чокопай. Не суди. Не гуди."
            ];
            tips.forEach((t, idx) => {
                setTimeout(() => addBatyaMessage(t), idx * 2500);
            });
        } 
        else if (action === 'хз, скажи че умеешь' || action === 'мне нужен ты)' || action === 'батя, когда за хлебом пойдешь?') {
            let reply = "";
            if (action === 'хз, скажи че умеешь') reply = "Я пока ничё не умею, но ты можешь повысить уровень бати.";
            if (action === 'мне нужен ты)') reply = "Слышь, я тебе не девка, ёпта. Но если хочешь со мной тусить — качай мой уровень.";
            if (action === 'батя, когда за хлебом пойдешь?') reply = "Хлеб сам себя не купит, но я пока занят. Хочешь ускорить процесс? Качай уровень.";
            
            addBatyaMessage(reply + " Для того что бы повысить левел бати пройди мою мини игру, ёпта.");
            showQuickActions(['пройти мини игру']);
        } 
        else if (action === 'пройти мини игру') {
            startMiniGame();
        } 
        else if (action === 'дать отдохнуть бате') {
            setLevel(10);
            addBatyaMessage("Ну и правильно, ёпта. Пойду вздремну...");
            showQuickActions(['закончить чат', 'Разбудить батю']);
        } 
        else if (action === 'Разбудить батю') {
            const wakeUpSeq = ["БАТЯ", "БАТЯ", "БАТЯ ПРОСНИСЬ АЛЁ"];
            wakeUpSeq.forEach((msg, i) => {
                setTimeout(() => addMessage(msg, true), i * 600);
            });
            setTimeout(() => {
                addBatyaMessage("Да чё тебе надо блять, ёпта?!");
                showQuickActions(['бать, у нас хлеб закончился...']);
            }, 2500);
        } 
        else if (action === 'бать, у нас хлеб закончился...') {
            addMessage("Бать, у нас хлеб закончился, сгоняй по бырому, а?", true);
            setTimeout(() => {
                addBatyaMessage("Да заебали ёпта, ладно, пойду схожу, заодно балтику куплю себе.");
                setTimeout(triggerBreadEnding, 2500);
            }, 1000);
        } 
        else if (action === 'закончить чат') {
            location.reload();
        }
    }

    function processNick(nick) {
        const clean = nick.toUpperCase();
        
        let resultHTML = `<div class="font-mono text-sm space-y-2 py-2">`;
        for (let i = 0; i < clean.length; i++) {
            const char = clean[i];
            const isLast = (i === clean.length - 1);
            const expansion = isLast ? NICK_SCHEMA_LAST[char] : NICK_SCHEMA_FIRST[char];
            
            // Using a specific class 'nick-line' to target for GSAP animation
            resultHTML += `<div class="nick-line flex items-center gap-2"><span class="text-blue-400 font-bold text-lg bg-white/5 w-8 h-8 flex items-center justify-center rounded">${char}</span> <span class="text-gray-400">—</span> <span class="text-gray-200">${expansion}</span></div>`;
        }
        resultHTML += `</div><div class="nick-line mt-3 text-gray-500 text-xs italic">...ёпта</div>`;
        
        addBatyaMessage(resultHTML);
    }

    function handleGreeting() {
        setLevel(10);
        addBatyaMessage("Здарова ёпта, че тебе от бати нужно?");
        showQuickActions(['хз, скажи че умеешь', 'мне нужен ты)', 'батя, когда за хлебом пойдешь?']);
    }

    function handleUserInput() {
        const val = userInput.value.trim();
        if (!val) return;
        
        addMessage(val, true);
        userInput.value = "";

        const lower = val.toLowerCase();
        
        if (lower === "ку" || lower === "привет" || lower === "здарова" || lower === "имба") {
            handleGreeting();
        } else {
            addBatyaMessage("Ты чё там бормочешь? Говори по делу, ёпта.");
        }
    }

    sendBtn.onclick = handleUserInput;
    userInput.onkeydown = (e) => e.key === 'Enter' && handleUserInput();

    // --- MINI GAME: SAVE BATYA ---
    const gameOverlay = document.getElementById('game-overlay');
    const modalContent = gameOverlay.querySelector('.glass');
    const gameOverScreen = document.getElementById('game-over-screen');
    const gCanvas = document.getElementById('game-canvas');
    const gCtx = gCanvas.getContext('2d');
    const gTimer = document.getElementById('game-timer');
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');

    let gameActive = false;
    let gameTime = 60;
    let playerX = 180;
    let breads = [];
    let gameInterval;
    let spawnRate = 0.015; // UPDATED: Lower spawn rate (was 0.03)
    let moveLeft = false;
    let moveRight = false;

    function startMiniGame() {
        gameOverlay.classList.remove('hidden');
        gameOverlay.classList.add('flex');
        gameOverScreen.classList.add('hidden');
        
        gsap.to(modalContent, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.5)" });

        gameActive = true;
        gameTime = 60;
        breads = [];
        playerX = 180;
        gTimer.innerText = gameTime;
        spawnRate = 0.018; // UPDATED: Reduced starting spawn rate for less bread

        if(gameInterval) clearInterval(gameInterval);

        gameInterval = setInterval(() => {
            gameTime--;
            gTimer.innerText = gameTime;
            if(gameTime % 10 === 0) spawnRate += 0.003; // UPDATED: Slower increase
            if (gameTime <= 0) endMiniGame(true);
        }, 1000);

        requestAnimationFrame(gameLoop);
    }

    function gameLoop() {
        if (!gameActive) return;

        gCtx.fillStyle = '#111';
        gCtx.fillRect(0, 0, gCanvas.width, gCanvas.height);
        
        gCtx.strokeStyle = '#222';
        gCtx.lineWidth = 1;
        for(let i=0; i<400; i+=40) {
            gCtx.beginPath(); gCtx.moveTo(i, 0); gCtx.lineTo(i, 400); gCtx.stroke();
            gCtx.beginPath(); gCtx.moveTo(0, i); gCtx.lineTo(400, i); gCtx.stroke();
        }

        // Movement Logic (Smoother)
        if (moveLeft && playerX > 20) playerX -= 5;
        if (moveRight && playerX < 340) playerX += 5;

        // Player
        gCtx.font = "40px Arial";
        gCtx.shadowBlur = 20;
        gCtx.shadowColor = "rgba(96, 165, 250, 0.5)";
        gCtx.fillText("🧔", playerX, 380);
        gCtx.shadowBlur = 0;

        // Breads
        if (Math.random() < spawnRate) {
            breads.push({ 
                x: Math.random() * 360, 
                y: -30, 
                speed: 3 + Math.random() * 3, 
                rotation: 0 
            });
        }

        for (let i = breads.length - 1; i >= 0; i--) {
            const b = breads[i];
            b.y += b.speed;
            
            gCtx.save();
            gCtx.translate(b.x + 15, b.y - 15);
            b.rotation += 0.05;
            gCtx.rotate(b.rotation);
            gCtx.font = "30px Arial";
            gCtx.fillText("🍞", -15, 15);
            gCtx.restore();

            if (b.y > 345 && b.y < 385 && b.x > playerX - 25 && b.x < playerX + 35) {
                endMiniGame(false);
                return;
            }
            if (b.y > 450) breads.splice(i, 1);
        }

        requestAnimationFrame(gameLoop);
    }

    // Controls
    document.addEventListener('keydown', (e) => {
        if (!gameActive) return;
        if (e.code === 'KeyA' || e.key === 'ArrowLeft') moveLeft = true;
        if (e.code === 'KeyD' || e.key === 'ArrowRight') moveRight = true;
    });
    document.addEventListener('keyup', (e) => {
        if (e.code === 'KeyA' || e.key === 'ArrowLeft') moveLeft = false;
        if (e.code === 'KeyD' || e.key === 'ArrowRight') moveRight = false;
    });

    // Mobile Touch Controls
    const addTouch = (elem, dir) => {
        elem.addEventListener('touchstart', (e) => { e.preventDefault(); dir === 'l' ? moveLeft = true : moveRight = true; });
        elem.addEventListener('touchend', (e) => { e.preventDefault(); dir === 'l' ? moveLeft = false : moveRight = false; });
        elem.addEventListener('mousedown', () => { dir === 'l' ? moveLeft = true : moveRight = true; });
        elem.addEventListener('mouseup', () => { dir === 'l' ? moveLeft = false : moveRight = false; });
        elem.addEventListener('mouseleave', () => { dir === 'l' ? moveLeft = false : moveRight = false; });
    };
    addTouch(btnLeft, 'l');
    addTouch(btnRight, 'r');


    function endMiniGame(won) {
        gameActive = false;
        clearInterval(gameInterval);
        
        if (won) {
            gsap.to(modalContent, { opacity: 0, scale: 0.8, duration: 0.5, onComplete: () => {
                gameOverlay.classList.remove('flex');
                gameOverlay.classList.add('hidden');
                setLevel(20);
                addBatyaMessage("Ахуеть.. как ты это сделал? Ладно, прошёл так прошёл, ну я кстати тебе ничё не обещал, поэтому пойду пивка бухну... посплю...");
                showQuickActions(['дать отдохнуть бате', 'разбудить батю']);
            }});
        } else {
            gameOverScreen.classList.remove('hidden');
        }
    }

    // --- ENDING ---
    function triggerBreadEnding() {
        const alertBox = document.getElementById('full-alert');
        const alertText = document.getElementById('full-alert-text');
        const alertSub = document.getElementById('full-alert-sub');
        const restartBtn = document.getElementById('restart-global-btn'); // Select new button
        
        alertBox.classList.remove('hidden');
        
        const tl = gsap.timeline();
        
        alertText.innerText = "Батя ушел за хлебом...";
        alertSub.innerText = "";
        
        tl.to(alertBox.querySelector('h2'), { opacity: 1, y: 0, duration: 1.5, ease: "power4.out" })
          .to(alertBox.querySelector('h2'), { opacity: 0, y: -20, duration: 1, delay: 2 })
          .call(() => {
              setLevel(30);
              alertText.innerText = "Скоро VortexFlare завезёт продолжение...";
              alertText.classList.replace('text-7xl', 'text-4xl'); // Make text smaller for credits
              alertSub.innerText = "BatyaGPT 3.5 Alpha End";
          })
          .to(alertBox.querySelector('h2'), { opacity: 1, y: 0, duration: 1.5 })
          .to(alertBox.querySelector('p'), { opacity: 1, duration: 1.5 }, "-=1")
          // UPDATED: Show restart button at end
          .to(restartBtn, { opacity: 1, y: 0, duration: 1, pointerEvents: "auto" }, "+=0.5");
    }

</script>
</body>
</html>
